# bitzkey_daemon's settings: key = value, # starts a comment. The command line overrides these.

# Where it listens: 0.0.0.0 is every network interface, so anyone on the network can open the page;
# 127.0.0.1 is this machine alone. There is no password.
host = 0.0.0.0
port = 49152

# Where the catalog, exports and brain reports are kept. Under systemd this is /var/lib/bitzkey_daemon,
# and needn't be set.
# data_dir = /var/lib/bitzkey_daemon

# Think on the GPU: yes, no, or auto (where there is one).
gpu = auto

# Start the first world paused, rather than running at once.
start_paused = no
